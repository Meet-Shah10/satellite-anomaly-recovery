[metadata]
name = satellite_recovery
version = 0.1.0
description = Risk-Aware Dynamic A* for Satellite Anomaly Recovery
author = Research Team

[options]
packages = find:
python_requires = >=3.11
install_requires =
    numpy>=1.26
    scipy>=1.12
    scikit-learn>=1.4
    joblib>=1.3
    pyyaml>=6.0
    tqdm>=4.66
    pandas>=2.2

[options.packages.find]
where = .

[tool:pytest]
testpaths = tests
